# Paso 1 (temporal): solo HTTP, para que Let's Encrypt pueda verificar el dominio.
# Para un Nginx que corre en Docker y comparte red con el contenedor venustech-web.
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $venustech http://venustech-web:4321;
        proxy_pass $venustech;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
