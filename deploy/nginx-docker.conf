# Paso 2 (definitivo): HTTPS. Para un Nginx que corre en Docker y comparte red con venustech-web.
# Instalar con:  sed "s/TU_DOMINIO/tu-dominio/g" deploy/nginx-docker.conf > ~/docker/nginx/conf.d/venustech.conf

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name TU_DOMINIO;

    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Subidas de imágenes y videos desde el panel
    client_max_body_size 250m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # El nombre se resuelve en cada petición: Nginx arranca aunque la web esté reiniciándose
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $venustech http://venustech-web:4321;

    location / {
        proxy_pass $venustech;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
