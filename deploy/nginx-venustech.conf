# Nginx en el VPS → reenvía a la web (contenedor Docker en 127.0.0.1:4321)
# Copiar a /etc/nginx/sites-available/venustech y reemplazar TU_DOMINIO.
# Luego `sudo certbot --nginx -d TU_DOMINIO` agrega el HTTPS automáticamente.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # Subidas de imágenes y videos desde el panel
    client_max_body_size 250m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Archivos con huella en el nombre: caché larga
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
